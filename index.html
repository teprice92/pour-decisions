* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background-color: var(--bg);
  background-image: var(--bg-art);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
  transition: background-color .4s, color .4s;
}
html[data-skin="metalgear"] body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3, .display {
  font-family: var(--font-display);
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  font-weight: var(--display-weight);
  text-wrap: balance;
  margin: 0;
  line-height: 1.1;
}
html[data-skin="nintendo"] h2 { font-size: 15px; line-height: 1.5; }
html[data-skin="nintendo"] h3 { font-size: 11px; line-height: 1.6; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-right: auto; }
.brand svg { width: 52px; height: 52px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); }
html[data-skin="nintendo"] .brand-name { font-size: 15px; }
html[data-skin="metalgear"] .brand-name { font-size: 2.1rem; }
.brand-sub { font-size: .8rem; color: var(--muted); }
.skins { display: flex; flex-wrap: wrap; gap: 6px; }
.skin-btn {
  font: 700 .72rem/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  padding: 8px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}
/* 19 themes is too many for a button row, so the picker is a dropdown */
.skins { display: none; }
.skin-select { display: flex; align-items: center; gap: 8px; }
.skin-select select { width: auto; padding: 7px 10px; font-weight: 700; }
.skin-btn i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.skin-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; }
.tab {
  font: 700 .95rem/1 var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track);
  background: none; border: 0; color: var(--muted); padding: 10px 14px; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0;
  border-bottom: 3px solid transparent;
}
html[data-skin="nintendo"] .tab { font-size: 10px; }
html[data-skin="metalgear"] .tab { font-size: 1.3rem; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .badge { font-family: var(--font-body); font-size: .7rem; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: 2px; letter-spacing: 0; }
.tabs .spacer { flex: 1; }

/* Generic pieces */
main { padding-block: 24px; }
.view { display: grid; gap: 20px; }
.panel { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 12px; }
.btn {
  font: 700 .95rem/1 var(--font-body); cursor: pointer; border-radius: calc(var(--radius) * .7);
  padding: 11px 16px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  transition: transform .12s, background .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.big { font-size: 1.15rem; padding: 16px 26px; min-height: 58px; font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); }
html[data-skin="nintendo"] .btn.big { font-size: 12px; }
html[data-skin="metalgear"] .btn.big { font-size: 1.6rem; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); background: transparent; }
.btn.small { padding: 7px 10px; min-height: 34px; font-size: .82rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
html[data-skin="nintendo"] .btn { border: 3px solid #1f1a1a; box-shadow: 3px 3px 0 #1f1a1a; }
html[data-skin="nintendo"] .btn:active { box-shadow: 0 0 0 #1f1a1a; transform: translate(3px,3px); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="number"], select, textarea {
  font: 500 1rem/1.3 var(--font-body); color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 9px 11px; width: 100%; min-width: 0;
}
html[data-skin="nintendo"] input[type="text"], html[data-skin="nintendo"] input[type="number"], html[data-skin="nintendo"] select, html[data-skin="nintendo"] textarea { border: 2px solid #1f1a1a; }
label.field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; background: var(--panel-2); }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.note { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: .9rem; color: var(--muted); }

/* Setup */
.setup-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 16px; }
.pcard { display: grid; gap: 10px; align-content: start; }
.pcard-head { display: flex; gap: 8px; align-items: center; }
.pcard-head .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.pcard-head input { font-weight: 700; font-size: 1.05rem; }
.games-list { display: grid; gap: 6px; counter-reset: g; margin: 0; padding: 0; list-style: none; }
.games-list li { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 6px; }
.games-list li::before { counter-increment: g; content: counter(g); font-size: .78rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.games-list li.played input { text-decoration: line-through; opacity: .55; }
.games-list input { padding: 7px 9px; font-size: .95rem; }
.pcard.active { outline: 3px solid var(--accent); outline-offset: 2px; }
.avatar-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 3px solid var(--pc); background: var(--panel-2); font-size: 1.3rem; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.avatar-pick { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.emoji-grid button { font-size: 1.2rem; border: 1px solid transparent; background: none; border-radius: 8px; padding: 4px; cursor: pointer; color: var(--fg); }
.emoji-grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--panel); }
.color-row { display: flex; flex-wrap: wrap; gap: 6px; }
.color-row button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
.color-row button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--fg); }
.lib-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 220px; overflow-y: auto; }
.lib-chip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.lib-chip button { font: 600 .88rem/1.2 var(--font-body); background: none; border: 0; color: var(--fg); cursor: pointer; padding: 7px 4px 7px 12px; }
.lib-chip button.x { color: var(--muted); padding: 7px 10px 7px 6px; }
.lib-chip .ct { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.lib-chip.used { opacity: .45; }
.tag { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); vertical-align: 1px; font-family: var(--font-body); font-weight: 700; }
.inject { border-top: 1px solid var(--line); padding-top: 12px; }
.inject .row input { flex: 1 1 200px; }
.lib-chip button[data-logpick] { padding-right: 12px; }
.lib-chip.picked { background: var(--accent); border-color: var(--accent); }
.lib-chip.picked button { color: var(--accent-fg); }
.win-name { color: var(--accent); font-weight: 700; }

/* Spin */
.spin-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .spin-layout { grid-template-columns: 1fr; } }
.wheel-box { position: relative; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 1; }
.wheel-box canvas { width: 100%; height: 100%; display: block; }
.pointer {
  position: absolute; left: 50%; top: -6px; width: 34px; height: 44px; transform: translateX(-50%); z-index: 2;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); transform-origin: 50% 10%;
}
.pointer svg { width: 100%; height: 100%; }
.pointer.tick { animation: tick .12s ease-out; }
@keyframes tick { 0% { transform: translateX(-50%) rotate(0); } 40% { transform: translateX(-50%) rotate(-14deg); } 100% { transform: translateX(-50%) rotate(0); } }
.hub {
  position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%,-50%);
  border-radius: 50%; border: 4px solid var(--accent); background: var(--panel-2); color: var(--fg); cursor: pointer;
  font: 400 clamp(.8rem, 2.6vw, 1.2rem)/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em;
  box-shadow: 0 0 0 6px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.5);
}
html[data-skin="nintendo"] .hub { font-size: 10px; }
.hub:disabled { cursor: wait; }
.up-next { display: grid; gap: 6px; }
.up-next .who { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); color: var(--accent); overflow-wrap: anywhere; }
html[data-skin="nintendo"] .up-next .who { font-size: clamp(16px, 4vw, 24px); line-height: 1.3; }
.order { display: flex; flex-wrap: wrap; gap: 6px; }
.order .chip.now { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { font: 600 .82rem/1 var(--font-body); border: 0; background: transparent; color: var(--muted); padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.landed { display: grid; gap: 14px; border: 2px solid var(--accent); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.92); opacity: .4; } to { transform: none; opacity: 1; } }
.landed .game-title { font-family: var(--font-display); font-size: clamp(1.6rem, 4.5vw, 2.4rem); line-height: 1.05; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); overflow-wrap: anywhere; }
html[data-skin="nintendo"] .landed .game-title { font-size: 16px; line-height: 1.5; }
.alert-mark { display: none; }
html[data-skin="metalgear"] .alert-mark { display: inline-block; color: var(--danger); font-family: "VT323", monospace; font-size: 3rem; line-height: .7; text-shadow: 0 0 12px var(--danger); animation: blink .5s steps(2) 3; }
@keyframes blink { 50% { opacity: 0; } }
.winner-grid, .drink-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { cursor: pointer; user-select: none; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick span { display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; }
.pick input:checked + span { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pick input[type="checkbox"] + span::before { content: "○"; font-weight: 700; }
.pick input[type="checkbox"]:checked + span::before { content: "✓"; }
.pick input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.amounts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.amounts .amt { min-width: 52px; font-variant-numeric: tabular-nums; }
.amounts .amt[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper input { width: 72px; text-align: center; }
.drinker { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); }
.drinker.off { opacity: .45; }
.drinker label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 700; }
.drinker .mini-amt { font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: center; font-weight: 700; }
.drinker button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-weight: 700; }

/* Round log */
.log { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.log li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.log .rn { font-family: var(--font-display); color: var(--muted); font-size: 1.1rem; }
html[data-skin="nintendo"] .log .rn { font-size: 10px; }
.log .what { min-width: 0; overflow-wrap: anywhere; }
.log .shots { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); text-align: right; }

/* Scores */
.score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.scard { display: grid; gap: 10px; justify-items: center; text-align: center; position: relative; }
.scard .crown { position: absolute; top: 12px; right: 12px; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; background: var(--accent); color: var(--accent-fg); padding: 4px 8px; border-radius: 999px; font-weight: 700; }
.scard .crown.alt { left: 12px; right: auto; background: var(--accent-2); color: #fff; }
.scard .pname { font-family: var(--font-display); font-size: 1.5rem; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); overflow-wrap: anywhere; }
html[data-skin="nintendo"] .scard .pname { font-size: 13px; line-height: 1.5; }
.scard .total { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
html[data-skin="nintendo"] .scard .total { font-size: 22px; }
.glass-big { width: 120px; height: 156px; }
.minis { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; min-height: 30px; }
.minis svg { width: 22px; height: 29px; }
.minis .more { font-size: .8rem; color: var(--muted); align-self: center; }
.stat-row { display: flex; gap: 16px; justify-content: center; font-size: .9rem; color: var(--muted); }
.stat-row b { color: var(--fg); font-variant-numeric: tabular-nums; }
.penalty { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

/* Glass SVG */
.glass .wave { animation: wave 2.4s linear infinite; }
.glass.static .wave { animation: none; }
.glass .liq { transition: transform 1.1s cubic-bezier(.3,.8,.3,1); }
@keyframes wave { to { transform: translateX(-50px); } }
.glass .bub { animation: bub 2.8s ease-in infinite; opacity: 0; }
.glass .bub:nth-child(3) { animation-delay: .9s; }
.glass .bub:nth-child(4) { animation-delay: 1.7s; }
@keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(-70px); opacity: 0; } }

/* History */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td.n, th.n { text-align: right; }
details.night { border-top: 1px solid var(--line); padding-block: 10px; }
details.night summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; list-style: none; }
details.night summary::-webkit-details-marker { display: none; }
details.night summary::before { content: "▸"; color: var(--accent); transition: transform .2s; }
details.night[open] summary::before { transform: rotate(90deg); }
details.night .body { padding: 10px 0 0 18px; display: grid; gap: 10px; }
.hist-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .hist-grid { grid-template-columns: 1fr; } }

/* Overlay: pour + chaos roll */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(6px);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
#pour { z-index: 70; } /* the pour always plays on top, even over the bracket or recap */
.pour-card { display: grid; justify-items: center; gap: 10px; text-align: center; max-width: 440px; cursor: pointer; }
.pour-card .glass { width: 200px; height: 260px; }
.pour-card .count { font-family: var(--font-display); font-size: 4rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
html[data-skin="nintendo"] .pour-card .count { font-size: 34px; }
.pour-card .who { font-size: 1.15rem; }
.pour-card .quip { font-style: italic; color: var(--muted); }
.sheet-modal { width: min(760px, 100%); }
.recap { display: grid; gap: 10px; }
.recap-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 10px; align-items: baseline; padding-block: 8px; border-top: 1px solid var(--line); }
.recap-row:first-child { border-top: 0; }
.recap-row .ic { font-size: 1.4rem; }
.recap-row b { font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); }
.titles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.titles div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel-2); }
.trophy-grid { display: grid; gap: 12px; }
.trophy-player { display: grid; gap: 6px; }
.trophies { display: flex; flex-wrap: wrap; gap: 6px; }
.trophy { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: .85rem; background: var(--panel-2); }
.trophy .ti { font-size: 1.1rem; }
.trophy.locked { opacity: .35; filter: grayscale(1); }
.bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.bround { display: grid; gap: 10px; align-content: center; }
.match { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel-2); display: grid; gap: 8px; }
.match .vs { font-weight: 700; }
.match .row input { flex: 1 1 120px; }
.champion { text-align: center; font-family: var(--font-display); font-size: 1.8rem; color: var(--accent); }
/* TV mode: one big screen with the wheel and the shot board, for casting or mirroring */
.tv-board { display: grid; gap: 8px; }
.tv-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding-block: 6px; border-top: 1px solid var(--line); }
.tv-row:first-child { border-top: 0; }
.tv-row svg { width: 40px; height: 52px; }
.tv-row .nm { font-family: var(--font-display); font-size: 1.3rem; overflow-wrap: anywhere; }
.tv-row .num { font-size: 1.3rem; font-weight: 700; }
html.tv body { font-size: 19px; }
html.tv .skin-select, html.tv .tabs .tab, html.tv #callGame { display: none; }
html.tv .wrap, html.tv .top-inner { max-width: none; }
html.tv .spin-layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
html.tv .wheel-box { max-width: min(78vh, 900px); }
html.tv #roundLog { display: none; }
html.tv footer { display: none; }
@media (max-width: 860px) { .tv-toggle { display: none; } }
.pour-card .pour-note { font-weight: 700; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.wild-card .game-title { color: var(--accent); }
details.bets summary { cursor: pointer; }
.bet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px; margin-block: 8px; }
.bet select { padding: 7px 9px; }
.modal { width: min(640px, 100%); display: grid; gap: 16px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rng-stage { display: grid; place-items: center; min-height: 320px; position: relative; perspective: 900px; }
.rng-stage .wheel-box { max-width: 320px; }
.rng-result { text-align: center; font-family: var(--font-display); font-size: 1.1rem; min-height: 1.5em; }
.rng-result b { font-size: 2.4rem; color: var(--accent); display: block; line-height: 1.1; }
html[data-skin="nintendo"] .rng-result b { font-size: 24px; }
.rng-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; align-items: end; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.coin { width: 170px; height: 170px; position: relative; transform-style: preserve-3d; }
.coin .face {
  position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; backface-visibility: hidden;
  font: 400 3.4rem/1 var(--font-display); color: var(--accent-fg);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 60%, #fff), var(--accent) 55%, color-mix(in srgb, var(--accent) 60%, #000));
  box-shadow: inset 0 0 0 8px color-mix(in srgb, var(--accent) 70%, #000), inset 0 0 0 12px color-mix(in srgb, var(--accent) 80%, #fff);
}
.coin .face small { display: block; font-size: .8rem; letter-spacing: .2em; font-family: var(--font-body); font-weight: 700; margin-top: 4px; }
.coin .face > div { text-align: center; }
html[data-skin="nintendo"] .coin .face { font-size: 26px; }
.coin .back { transform: rotateX(180deg); }
.die { width: 130px; height: 130px; position: relative; transform-style: preserve-3d; }
.die .f {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 18%;
  font: 400 3rem/1 var(--font-display); background: var(--panel-2); color: var(--fg);
  border: 3px solid var(--accent); box-shadow: inset 0 0 24px rgba(0,0,0,.35);
}
html[data-skin="nintendo"] .die .f { font-size: 22px; }
.die .f1 { transform: translateZ(65px); }
.die .f2 { transform: rotateY(180deg) translateZ(65px); }
.die .f3 { transform: rotateY(90deg) translateZ(65px); }
.die .f4 { transform: rotateY(-90deg) translateZ(65px); }
.die .f5 { transform: rotateX(90deg) translateZ(65px); }
.die .f6 { transform: rotateX(-90deg) translateZ(65px); }
.ticker { font: 400 6rem/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.rolls { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .9rem; }
.rolls li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 4px; }
.rolls li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--accent); color: var(--accent-fg); padding: 10px 16px; border-radius: 999px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  max-width: calc(100% - 32px);
}
.empty { text-align: center; padding: 30px 10px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
footer { text-align: center; font-size: .8rem; color: var(--muted); padding-top: 20px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <!-- Logo: a shot glass whose liquid is a prize wheel, mid-pour -->
        <defs>
          <clipPath id="logoClip"><path d="M14 14 L50 14 L45 52 L19 52 Z"/></clipPath>
        </defs>
        <g clip-path="url(#logoClip)">
          <rect x="0" y="24" width="64" height="40" fill="var(--liquid)"/>
          <g transform="translate(32 37)"><circle r="13.5" fill="var(--liquid-2)"/><path d="M0 0 L0.00 -12.00 A12 12 0 0 1 8.49 -8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L8.49 -8.49 A12 12 0 0 1 12.00 0.00 Z" fill="var(--fg)"/><path d="M0 0 L12.00 0.00 A12 12 0 0 1 8.49 8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L8.49 8.49 A12 12 0 0 1 0.00 12.00 Z" fill="var(--fg)"/><path d="M0 0 L0.00 12.00 A12 12 0 0 1 -8.49 8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L-8.49 8.49 A12 12 0 0 1 -12.00 0.00 Z" fill="var(--fg)"/><path d="M0 0 L-12.00 0.00 A12 12 0 0 1 -8.49 -8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L-8.49 -8.49 A12 12 0 0 1 -0.00 -12.00 Z" fill="var(--fg)"/><circle r="2.6" fill="var(--accent)"/></g>
        </g>
        <path d="M11 10 L53 10 L47 54 L17 54 Z" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round"/>
        <rect x="16" y="54" width="32" height="5" rx="1.5" fill="var(--fg)"/>
        <path d="M32 4 L28 10 L36 10 Z" fill="var(--accent)"/>
        <circle cx="54" cy="22" r="2.4" fill="var(--liquid)"/>
        <path d="M52 16 q2 3 2 5" stroke="var(--liquid)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand-name">Pour Decisions</div>
        <div class="brand-sub" id="tagline">Bet list night</div>
      </div>
    </div>
    <div class="skins" id="skins" role="group" aria-label="Theme"></div>
    <label class="skin-select"><span class="eyebrow">Theme</span><select id="skinSelect" aria-label="Theme"></select></label>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="setup" id="tab-setup">Lineup</button>
      <button class="tab" role="tab" data-tab="spin" id="tab-spin">Spin</button>
      <button class="tab" role="tab" data-tab="scores" id="tab-scores">Shots</button>
      <button class="tab" role="tab" data-tab="history" id="tab-history">History</button>
      <span class="spacer"></span>
      <button class="btn small ghost tv-toggle" id="tvBtn" type="button">TV mode</button>
      <button class="btn small" id="callGame" type="button">Log a game</button>
      <button class="btn small primary" id="openRng" type="button">Chaos roll</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-setup" hidden></section>

  <section class="view" id="view-spin" hidden>
    <div class="spin-layout">

  class Wheel {

      const css = getComputedStyle(document.documentElement);
      const fg = css.getPropertyValue("--fg").trim(), line = css.getPropertyValue("--accent").trim();
      const bodyFont = css.getPropertyValue("--font-body").trim();
      const R = W / 2 - W * 0.03, n = this.items.length;
      c.clearRect(0, 0, W, W);
      c.save(); c.translate(W / 2, W / 2);
      // rim
      c.beginPath(); c.arc(0, 0, R + W * 0.022, 0, Math.PI * 2); c.fillStyle = line; c.fill();
      if (!n) {
        c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fillStyle = css.getPropertyValue("--panel-2").trim(); c.fill();
        c.restore(); return;
      }
      const seg = (Math.PI * 2) / n;
      const fs = Math.max(W * 0.022, Math.min(W * 0.07, (W * 0.9) / n));
      for (let i = 0; i < n; i++) {
        const a0 = this.rot - Math.PI / 2 + i * seg;
        const col = this.items[i].color;
        c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, a0, a0 + seg); c.closePath();

        c.save(); c.rotate(a0 + seg / 2);

        c.font = `700 ${fs}px ${bodyFont}`;

        c.fillText(label, R - W * 0.03, 0);
        c.restore();

        const a = this.rot - Math.PI / 2 + (i * Math.PI * 2) / Math.min(n, 48);

      const target = -((index + 0.5 + jitter) * seg);

      const start = this.rot;
      let delta = ((target - start) % TAU + TAU) % TAU;
      delta += TAU * (5 + randInt(3));
      if (reduceMotion) ms = 400;
      this.spinning = true;
      let last = this.indexAt(start);
      return new Promise((res) => {
        const t0 = performance.now();
        const step = (now) => {
          const p = Math.min(1, (now - t0) / ms);
          const e = 1 - Math.pow(1 - p, 4);
          this.rot = start + delta * e;
          this.draw();

    const n = N(), back = (n.paused || []).pop();

    form = back && back.form && back.form.gameId === back.pending.gameId ? back.form : null;

  }
  function dropUnusedExtra() {
    const n = N(), id = n.pending && n.pending.gameId;
    if (!id || !n.extras) return;

  // ---------- Wild slices ----------
  const WILDS = {
    double: { label: "Double or nothing", desc: "The next game's shots are doubled. Spin again." },
    everyone: { label: "Everyone drinks", desc: "Everybody takes a half. Then spin again." },
    picks: { label: "Spinner picks", desc: "Spinner, you choose the next game." },
    reverse: { label: "Reverse!", desc: "Turn order flips direction. Spin again." },
    waterfall: { label: "Waterfall", desc: "Everyone starts drinking with the spinner. Nobody stops until the person before them stops. Spin again when you're done." },
  };
  // seeded so the wild slices stay put between redraws and only reshuffle after each round
  function seeded(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function wildItems(count) {
    const n = N(), want = Math.min(S.wildSlices || 0, 3);
    if (!want || count < 3 || n.pending) return [];
    const rnd = seeded(n.rounds.length * 7919 + (n.created % 100000));
    const keys = Object.keys(WILDS), out = [];
    while (out.length < want) { const k = keys[Math.floor(rnd() * keys.length)]; if (!out.includes(k)) out.push(k); }
    return out;
  }
  function refreshWheel() {
    if (mainWheel.spinning) return;
    const n = N();
    // the pending game is still unplayed, so it stays on the wheel until recorded
    const list = wheelPool().list;
    const colors = skinColors();
    const idx = new Map(n.players.map((p, i) => [p.id, i]));
    const items = list.map((g, i) => {
      const e = playerById(g.by)?.emoji;
      return { id: g.id, label: (e ? e + " " : "") + g.title, color: colors[(i + (idx.get(g.by) || 0)) % colors.length] };
    });
    const wild = wildItems(items.length);
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffcc00";
    wild.forEach((k, j) => {
      const at = Math.floor(((j + 0.5) * (items.length + wild.length)) / wild.length);
      items.splice(Math.min(at, items.length), 0, { id: "wild:" + k, wild: k, label: "★ " + WILDS[k].label, color: accent });
    });
    mainWheel.setItems(items);
    // if a pending game exists, park the wheel on it
    if (n.pending && !mainWheel._parked) {
      const k = mainWheel.items.findIndex((x) => x.id === n.pending.gameId);
      if (k >= 0) { mainWheel.rot = -((k + 0.5) * (Math.PI * 2) / mainWheel.items.length); mainWheel.draw(); }
      mainWheel._parked = true;
    }
  }

  async function recordRound() {
    const n = N();
    if (!form.winner) return toast("Pick a winner (or Tie) first");
    const g = gameById(n.pending.gameId);
    const injected = !!n.pending.injected;
    const winner = form.winner === "tie" ? null : form.winner;
    const drinks = Object.entries(form.drinks).filter(([pid, d]) => d.on && d.amt > 0 && playerById(pid)).map(([pid, d]) => ({ pid, amt: d.amt }));
    const notes = [];
    // side bets: wrong guesses drink the stake, right guesses hand it out
    const bets = Object.entries(form.bets || {}).filter(([, pick]) => pick).map(([pid, pick]) => ({ pid, pick, right: !!winner && pick === winner }));
    if (winner && bets.length) {
      const stake = S.betStake ?? 0.5;
      bets.filter((b) => !b.right).forEach((b) => addDrink(drinks, b.pid, stake));
      const right = bets.filter((b) => b.right).map((b) => pnameById(b.pid));
      const wrong = bets.filter((b) => !b.right).map((b) => pnameById(b.pid));
      if (right.length) notes.push(`🔮 ${right.join(", ")} called it. Hand out ${fmtShots(stake)}.`);
      if (wrong.length) notes.push(`🎲 ${wrong.join(", ")} bet wrong: +${fmtShots(stake)}.`);
    }
    notes.push(...streakNotes(winner, drinks));
    const before = totals(), trophiesBefore = trophyKeys();
    n.rounds.push({ id: uid(), ts: Date.now(), gameId: g.id, title: g.title, by: g.by, spunBy: n.pending.spunBy, injected, winner, drinks, bets, skin: S.skin, broke: form._broke, mod: !injected ? n.nextMod || undefined : undefined });
    if (!injected) { advanceTurn(n); n.nextMod = null; }
    form = null; resumePaused();
    save(); renderSpin();
    notes.push(...trophyNotes(trophiesBefore));
    await pour(drinks, { notes });
    await waterCheck(before);
  }

  function addDrink(drinks, pid, amt) {
    const d = drinks.find((x) => x.pid === pid);

  // On-fire callouts, and a bonus pour for anyone whose 3+ streak just got broken
  function streakNotes(winner, drinks) {
    const prev = streaks(), out = [];
    if (!winner) return out;
    const broke = Object.keys(prev).filter((pid) => pid !== winner && prev[pid] >= 3);
    broke.forEach((pid) => {
      addDrink(drinks, pid, S.streakBonus ?? 0.5);
      out.push(`🧊 Streak breaker! ${pnameById(winner)} ended ${pnameById(pid)}'s ${prev[pid]}-win streak. ${pnameById(pid)} drinks +${fmtShots(S.streakBonus ?? 0.5)}.`);
    });
    if (form) form._broke = broke.length ? broke : undefined;
    const now = (prev[winner] || 0) + 1;
    if (now >= 3) out.push(`🔥 ${pnameById(winner)} is on fire: ${now} wins in a row!`);
    return out;
  }

  // ---------- Pour animation ----------
  let pourSkip = false;
  async function pour(drinks, { notes = [], water = false, names = [] } = {}) {
    if (!drinks.length && !water && !notes.length) return;
    const max = water ? 1 : drinks.length ? Math.max(...drinks.map((d) => d.amt)) : 0;
    const groups = {};
    drinks.forEach((d) => (groups[d.amt] = groups[d.amt] || []).push(pnameById(d.pid)));
    const who = water ? `💧 ${names.map(esc).join(", ")}: grab a glass of water.` : Object.entries(groups).map(([a, ns]) => `${ns.map(esc).join(", ")} · ${fmtShots(+a)}`).join("<br>");
    const ov = $("#pour"), card = $("#pourCard");
    card.innerHTML = `<div class="eyebrow">${water ? "Water round" : "Bottoms up"}</div>${glassSVG(0, { water })}<div class="count num" id="pourCount">${water ? "💧" : "0"}</div><div class="who">${who}</div>${notes.map((t) => `<div class="pour-note">${esc(t)}</div>`).join("")}<div class="quip">${water ? "Hydrate or die-drate." : esc(pickOne(SKINS[S.skin].quips))}</div><div class="muted" style="font-size:.8rem">Tap to close</div>`;
    ov.hidden = false; pourSkip = false;
    const svg = card.querySelector("svg");
    await wait(60);
    let left = max, count = 0;
    const fast = max > 4;
    while (left > 0.001 && !pourSkip) {
      const f = Math.min(1, left);
      const ms = (fast ? 450 : 900) * f + 250;
      setGlass(svg, f, ms);
      if (water) blip(500 + 300 * f, ms / 1000, "sine", 0.03); else blip(300 + 400 * f, ms / 1000, pack().pour || "sine", 0.03);
      await wait(ms);
      count += f; left -= f;
      if (!water) $("#pourCount").textContent = fmtShots(count);
      if (left > 0.001 && !pourSkip) { await wait(fast ? 120 : 260); setGlass(svg, 0, fast ? 220 : 380); await wait(fast ? 240 : 400); }
    }
    if (!water && max) $("#pourCount").textContent = fmtShots(max);
    if (!pourSkip) await wait(1600 + notes.length * 900);
    ov.hidden = true;
  }

  // ---------- Trophies ----------
  const TROPHIES = [
    { id: "first", icon: "🥇", name: "First win", desc: "Win a game", test: (st) => st.wins >= 1 },
    { id: "hat", icon: "🎩", name: "Hat trick", desc: "Win 3 games in a row", test: (st) => st.bestStreak >= 3 },
    { id: "survivor", icon: "🛟", name: "Survivor", desc: "Take 10 shots in one night", test: (st) => st.maxNightShots >= 10 },
    { id: "untouchable", icon: "🛡️", name: "Untouchable", desc: "Win 3+ games in a night and drink 1 shot or less", test: (st) => st.untouchable },
    { id: "perfect", icon: "💎", name: "Perfect night", desc: "Win every game you played in a night (3 or more)", test: (st) => st.perfect },
    { id: "breaker", icon: "🧊", name: "Streak breaker", desc: "End someone's 3+ win streak", test: (st) => st.breaks >= 1 },
    { id: "oracle", icon: "🔮", name: "Oracle", desc: "Call 5 side bets right", test: (st) => st.betsRight >= 5 },

    { id: "tourist", icon: "🗺️", name: "Theme tourist", desc: "Win on 8 different themes", test: (st) => st.skinWins.size >= 8 },
    { id: "champ", icon: "👑", name: "Champion", desc: "Win a finale bracket", test: (st) => st.finales >= 1 },
    { id: "regular", icon: "🍻", name: "Regular", desc: "Play 5 nights", test: (st) => st.nights >= 5 },
    { id: "legend", icon: "🏆", name: "Legend", desc: "Win 50 games all-time", test: (st) => st.wins >= 50 },
  ];
  const nightsForStats = () => [...S.archive, ...(N().started ? [N()] : [])];
  function playerStats(nights = nightsForStats()) {
    const m = {};
    nights.forEach((night) => {
      const t = totals(night);
      night.players.forEach((p) => {
        const key = p.name.trim().toLowerCase(); if (!key) return;
        const st = m[key] || (m[key] = { key, name: p.name.trim(), emoji: p.emoji, wins: 0, bestStreak: 0, maxNightShots: 0, untouchable: false, perfect: false, skinWins: new Set(), betsRight: 0, nights: 0, finales: 0, breaks: 0 });
        if (p.emoji) st.emoji = p.emoji;
        st.nights++; st.wins += t[p.id].wins; st.maxNightShots = Math.max(st.maxNightShots, t[p.id].shots);
        if (t[p.id].wins >= 3 && t[p.id].shots <= 1) st.untouchable = true;
        const played = night.rounds.filter((r) => r.gameId && (r.winner === p.id || r.drinks.some((d) => d.pid === p.id)));
        if (played.length >= 3 && played.every((r) => r.winner === p.id)) st.perfect = true;
        let cur = 0;
        night.rounds.forEach((r) => {
          (r.bets || []).forEach((b) => { if (b.pid === p.id && b.right) st.betsRight++; });
          if (!r.gameId) return;
          cur = r.winner === p.id ? cur + 1 : 0;
          st.bestStreak = Math.max(st.bestStreak, cur);
          if (r.winner === p.id && r.skin) st.skinWins.add(r.skin);
          if (r.winner === p.id && (r.broke || []).length) st.breaks++;
        });
        if (night.finale?.champion === p.id) st.finales++;
      });
    });
    return m;
  }
  function trophyKeys() {

    Object.values(st).forEach((x) => TROPHIES.forEach((t) => { if (t.test(x)) out.add(x.key + "|" + t.id); }));

  // ---------- Night recap ----------
  function recapData(night) {
    const t = totals(night), ps = night.players;
    const games = night.rounds.filter((r) => r.gameId);
    const sh = (p) => t[p.id].shots, wn = (p) => t[p.id].wins;
    const byWins = ps.slice().sort((a, b) => wn(b) - wn(a) || sh(a) - sh(b));
    const byShots = ps.slice().sort((a, b) => sh(b) - sh(a));
    const counts = {}; games.forEach((r) => (counts[r.title] = (counts[r.title] || 0) + 1));
    const topGame = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    // biggest upset: a win by the player furthest behind the leader at that moment
    const so = {}; ps.forEach((p) => (so[p.id] = 0));
    let upset = null;
    games.forEach((r) => {
      if (r.winner && so[r.winner] !== undefined) {
        const leader = ps.reduce((a, p) => (so[p.id] > so[a.id] ? p : a), ps[0]);
        const gap = so[leader.id] - so[r.winner];
        if (gap >= 2 && leader.id !== r.winner && (!upset || gap > upset.gap)) upset = { gap, winner: r.winner, leader: leader.id, title: r.title, score: `${so[leader.id]}–${so[r.winner]}` };
        so[r.winner]++;
      }
    });
    // per-player titles
    const pen = {}, br = {}, bw = {}, stk = {};
    ps.forEach((p) => { pen[p.id] = 0; br[p.id] = 0; bw[p.id] = 0; stk[p.id] = 0; });
    let cur = {}; ps.forEach((p) => (cur[p.id] = 0));
    night.rounds.forEach((r) => {
      if (!r.gameId && /penalty/i.test(r.note || "")) r.drinks.forEach((d) => pen[d.pid] !== undefined && pen[d.pid]++);
      (r.bets || []).forEach((b) => { if (b.right) br[b.pid] = (br[b.pid] || 0) + 1; else if (r.winner) bw[b.pid] = (bw[b.pid] || 0) + 1; });
      if (r.gameId) ps.forEach((p) => { cur[p.id] = r.winner === p.id ? cur[p.id] + 1 : 0; stk[p.id] = Math.max(stk[p.id], cur[p.id]); });
    });
    const titles = {}, taken = new Set();
    const award = (title, p, ok) => { if (p && ok && !titles[p.id] && !taken.has(title)) { titles[p.id] = title; taken.add(title); } };
    const maxBy = (f) => ps.slice().sort((a, b) => f(b) - f(a))[0];
    award("The Champ", byWins[0], wn(byWins[0]) > 0);
    award("The Sponge", byShots[0], sh(byShots[0]) > 0);
    award("On Fire", maxBy((p) => stk[p.id]), stk[maxBy((p) => stk[p.id]).id] >= 3);

                ${[0.25, 0.5, 0.75, 1, 1.5, 2, 3].map((a) => `<button type="button" class="btn small amt" data-defamt="${a}" aria-pressed="${(S.defaultShots ?? 1) === a}">${fmtShots(a)}</button>`).join("")}
                <span class="stepper"><button type="button" class="btn small" data-defstep="-0.25" aria-label="Quarter shot less">−</button>
                <span class="num" style="min-width:2.5em;text-align:center;font-weight:700">${fmtShots(S.defaultShots ?? 1)}</span>
                <button type="button" class="btn small" data-defstep="0.25" aria-label="Quarter shot more">+</button></span>
              </div>
              <div class="muted" style="font-size:.85rem">Every new game starts with this much on the line. You can still change it per game.</div>
            </div>
            <label class="pick" style="align-self:flex-start"><input type="checkbox" id="defWinnerHalf" ${S.winnerHalf ? "checked" : ""}><span>Winner drinks half by default</span></label>
            ${settingRow("Wild slices on the wheel", "wildSlices", [[0, "Off"], [1, "1"], [2, "2"], [3, "3"]], S.wildSlices ?? 2)}
            ${settingRow("Side bet stake", "betStake", [[0.25, "¼"], [0.5, "½"], [1, "1"]], S.betStake ?? 0.5)}
            ${settingRow("Streak-breaker bonus", "streakBonus", [[0, "Off"], [0.25, "¼"], [0.5, "½"], [1, "1"]], S.streakBonus ?? 0.5)}
            ${settingRow("Water round every", "waterEvery", [[0, "Off"], [2, "2 shots"], [3, "3 shots"], [5, "5 shots"]], S.waterEvery ?? 3)}
            <div class="row"><button class="btn" type="button" id="soundBtn" aria-pressed="${S.sound}">${S.sound ? "Sound on" : "Sound off"}</button></div>
          </div>
        </div>
      </div>`;
  }
  function settingRow(label, key, opts, cur) {
    return `<div class="stack" style="gap:6px"><div class="eyebrow">${label}</div><div class="seg" role="group" aria-label="${label}">${opts.map(([v, l]) => `<button type="button" data-set="${key}" data-val="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div></div>`;
  }
  // ---------- Install as a phone app ----------
  let installPrompt = null;
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const embedded = (() => { try { return window.self !== window.top; } catch { return true; } })();
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; if (S.tab === "history") renderHistory(); });
  window.addEventListener("appinstalled", () => { installPrompt = null; toast("Installed. Open Pour Decisions from your home screen."); if (S.tab === "history") renderHistory(); });
  // ask the browser not to clear saved nights to free up space
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { /* not supported */ }
  function installPanelHTML() {
    if (embedded) return "";
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let body;
    if (isStandalone()) body = `<div class="muted">You're using the installed app. It works offline and picks up updates automatically the next time you open it online.</div>`;
    else if (installPrompt) body = `<div class="muted">Add Pour Decisions to your home screen. It opens full screen, works offline, and updates itself from the site.</div><div class="row"><button class="btn primary" type="button" id="installBtn">Install app</button></div>`;
    else if (ios) body = `<div class="muted">On iPhone: tap the Share button in Safari, then <b>Add to Home Screen</b>. It works offline and updates itself from the site.</div>`;
    else body = `<div class="muted">Open your browser's menu and choose <b>Install app</b> or <b>Add to Home screen</b>. It works offline and updates itself from the site.</div>`;
    return `<div class="panel stack"><h3>Phone app</h3>${body}</div>`;
  }
  const backupJSON = () => JSON.stringify({ app: "pour-decisions", version: 1, exported: Date.now(), archive: S.archive, night: S.night }, null, 1);
  function importBackup(text) {
    try {
      const d = JSON.parse(text);
      if (d.app !== "pour-decisions" || !Array.isArray(d.archive)) throw new Error("bad");
      const have = new Set(S.archive.map((x) => x.id));
      let added = 0;
      d.archive.forEach((x) => { if (!have.has(x.id)) { S.archive.push(x); added++; } });
      S.archive.sort((a, b) => (a.started || a.created) - (b.started || b.created));
      if (d.night && d.night.started && !have.has(d.night.id) && d.night.id !== S.night.id && (!S.night.started || S.night.sample)) S.night = d.night;
      save(); renderAll(); toast(`Restored ${added} night${added === 1 ? "" : "s"}`);
    } catch { toast("That doesn't look like a Pour Decisions backup"); }
  }
  $("#view-history").addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.recap) { const nt = S.archive.find((x) => x.id === b.dataset.recap); if (nt) openSheet("recap", nt); return; }
    if (b.dataset.del) {
      if (deleteArm !== b.dataset.del) { deleteArm = b.dataset.del; renderHistory(); const d = $(`[data-del="${deleteArm}"]`); d && (d.closest("details").open = true); return; }
      S.archive = S.archive.filter((x) => x.id !== b.dataset.del); deleteArm = null; save(); renderHistory(); toast("Night deleted");
    } else if (b.id === "endKeep" || b.id === "endNew") {
      const mode = b.id === "endKeep" ? "keep" : "new";
      if (endArm !== mode) { endArm = mode; renderHistory(); setTimeout(() => { if (endArm === mode) { endArm = false; renderHistory(); } }, 3500); return; }
      endArm = false;
      const old = N();
      old.ended = Date.now(); old.pending = null;
      S.archive.push(old);
      const per = old.perPlayer;
      const players = mode === "keep" ? old.players.map((p) => Object.assign(mkPlayer(p.name, [], per), { emoji: p.emoji, color: p.color })) : [mkPlayer("Player 1", [], per), mkPlayer("Player 2", [], per)];
      S.night = newNight(players); S.night.perPlayer = per; form = null;
      save(); toast("Night saved to the hall of fame"); setTab("setup");
      openSheet("recap", old);
    } else if (b.id === "copyBackup") {
      const txt = backupJSON();
      try { await navigator.clipboard.writeText(txt); toast("Backup copied"); }
      catch { const box = $("#importBox"); box.value = txt; box.select(); toast("Copy blocked here. The backup is selected in the box below."); }
    } else if (b.id === "dlBackup") {
      const url = URL.createObjectURL(new Blob([backupJSON()], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = `pour-decisions-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    } else if (b.id === "sendNight") {
      const url = location.href.split("#")[0] + "#night=" + (await packNight(N()));
      try {
        if (navigator.share) { await navigator.share({ title: "Pour Decisions night", text: "Open tonight's Pour Decisions night", url }); return; }
      } catch { return; /* share cancelled */ }
      try { await navigator.clipboard.writeText(url); toast("Link copied. Send it to the other phone."); }
      catch { const box = $("#importBox"); box.value = url; box.select(); toast("Copy blocked. The link is selected in the box below."); }
    } else if (b.id === "importBtn") {
      importBackup($("#importBox").value);
    } else if (b.id === "installBtn" && installPrompt) {
      installPrompt.prompt();
      try { await installPrompt.userChoice; } catch { /* dismissed */ }
      installPrompt = null; renderHistory();
    } else if (b.dataset.defamt || b.dataset.defstep) {
      const cur = S.defaultShots ?? 1;
      S.defaultShots = b.dataset.defamt ? parseFloat(b.dataset.defamt) : Math.max(0.25, q4(cur + parseFloat(b.dataset.defstep)));
      save(); renderHistory(); toast(`New games start at ${fmtShots(S.defaultShots)} shot${S.defaultShots === 1 ? "" : "s"}`);
    } else if (b.dataset.set) {
      S[b.dataset.set] = parseFloat(b.dataset.val); save(); renderHistory();
    } else if (b.id === "soundBtn") {
      S.sound = !S.sound; save(); renderHistory();
    }
  });
  $("#view-history").addEventListener("change", (e) => {
    if (e.target.id === "defWinnerHalf") { S.winnerHalf = e.target.checked; save(); return; }
    if (e.target.id !== "importFile" || !e.target.files[0]) return;
    const r = new FileReader(); r.onload = () => importBackup(String(r.result)); r.readAsText(e.target.files[0]);
  });

  // ---------- Chaos roll (RNG) ----------
  let rngMode = "wheel", rngWheel = null, rolling = false;
  const PRESETS = [["1–6", 1, 6], ["1–20", 1, 20], ["Heads/Tails", 1, 2], ["1–10", 1, 10], ["0–100", 0, 100]];
  $("#rngPresets").innerHTML = PRESETS.map(([l, a, b]) => `<button type="button" class="btn small ghost" data-pmin="${a}" data-pmax="${b}">${l}</button>`).join("");
  function rngRange() {
    let a = parseInt($("#rngMin").value, 10), b = parseInt($("#rngMax").value, 10);
    if (!Number.isFinite(a)) a = 1; if (!Number.isFinite(b)) b = a;
    if (a > b) [a, b] = [b, a];
    return [a, b];
  }
  function coinLabel(v, a, b) { return b - a === 1 ? (v === a ? "Heads" : "Tails") : ""; }
  function buildStage() {
    const [a, b] = rngRange(), count = b - a + 1;
    $$("#rngMode button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === rngMode)));
    const st = $("#rngStage");
    rngWheel = null;
    if (rngMode === "wheel" && count <= 60) {
      st.innerHTML = `<div class="wheel-box"><div class="pointer" id="rngPointer"><svg viewBox="0 0 34 44"><path d="M17 42 L3 6 Q17 -2 31 6 Z" fill="var(--accent)" stroke="var(--fg)" stroke-width="2.5" stroke-linejoin="round"/></svg></div><canvas id="rngWheel"></canvas></div>`;
      rngWheel = new Wheel($("#rngWheel"), $("#rngPointer"));
      const cols = skinColors();
      rngWheel.setItems(Array.from({ length: count }, (_, i) => ({ label: String(a + i), color: cols[i % cols.length] })));
    } else if (rngMode === "wheel") {
      st.innerHTML = `<div class="stack" style="justify-items:center"><div class="ticker num" id="ticker">?</div><div class="muted">${count} numbers is too many slices, so this one spins like a slot reel.</div></div>`;
    } else if (rngMode === "coin") {
      st.innerHTML = `<div class="coin" id="coin"><div class="face front"><div><span id="coinF">${a}</span><small>${coinLabel(a, a, b) || "MIN " + a}</small></div></div><div class="face back"><div><span id="coinB">${b}</span><small>${coinLabel(b, a, b) || "MAX " + b}</small></div></div></div>`;
    } else {
      const faces = Array.from({ length: 6 }, (_, i) => (count <= 6 ? a + (i % count) : a + randInt(count)));
      st.innerHTML = `<div class="die" id="die">${faces.map((v, i) => `<div class="f f${i + 1}">${v}</div>`).join("")}</div>`;
    }
  }
  function renderRolls() {
    const rolls = (N().rolls || []).slice(-6).reverse();
    $("#rngLog").innerHTML = rolls.length ? `<div class="eyebrow" style="margin-bottom:6px">Tonight's rolls</div><ul class="rolls">${rolls.map((r) => `<li><span>${esc(r.note || "Roll")} <span class="muted">(${r.min}–${r.max}, ${r.mode})</span></span><b class="num">${r.result}</b></li>`).join("")}</ul>` : "";
  }
  function openRng() { $("#rng").hidden = false; $("#rngResult").innerHTML = ""; buildStage(); renderRolls(); $("#rngGo").focus(); }
  function closeRng() { if (rolling) return; $("#rng").hidden = true; }
  $("#openRng").addEventListener("click", openRng);
  $("#closeRng").addEventListener("click", closeRng);
  $("#rng").addEventListener("click", (e) => { if (e.target.id === "rng") closeRng(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("#sheet").hidden) closeSheet(); if (!$("#logGame").hidden) closeLog(); if (!$("#rng").hidden) closeRng(); if (!$("#pour").hidden) { pourSkip = true; $("#pour").hidden = true; } } });
  $("#rngMode").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (!b || rolling) return; rngMode = b.dataset.mode; buildStage(); });
  $("#rngPresets").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pmin]"); if (!b || rolling) return;
    $("#rngMin").value = b.dataset.pmin; $("#rngMax").value = b.dataset.pmax;
    if (b.dataset.pmax === "2") rngMode = "coin";
    buildStage();
  });
  ["rngMin", "rngMax"].forEach((id) => $("#" + id).addEventListener("change", () => !rolling && buildStage()));
  $("#rngGo").addEventListener("click", async () => {
    if (rolling) return;
    rolling = true; $("#rngGo").disabled = true; $("#rngResult").innerHTML = "&nbsp;";
    buildStage();
    const [a, b] = rngRange(), count = b - a + 1;
    const k = randInt(count), v = a + k;
    if (rngMode === "wheel" && rngWheel) {
      await rngWheel.spinTo(k, 3800);
    } else if (rngMode === "wheel") {
      const tk = $("#ticker"); let d = 30;
      while (d < 260 && !reduceMotion) { tk.textContent = a + randInt(count); blip(900, 0.015, "square", 0.02); await wait(d); d *= 1.12; }
      tk.textContent = v;
    } else if (rngMode === "coin") {
      const coin = $("#coin");
      // land on the front face and paint the result there
      const flick = setInterval(() => { $("#coinF").textContent = a + randInt(count); $("#coinB").textContent = a + randInt(count); }, 90);
      const anim = coin.animate([
        { transform: "translateY(0) rotateX(0deg)" },
        { transform: "translateY(-150px) rotateX(1080deg)", offset: 0.5 },
        { transform: "translateY(0) rotateX(2160deg)" },
      ], { duration: reduceMotion ? 10 : 1800, easing: "cubic-bezier(.3,.6,.4,1)" });
      await anim.finished.catch(() => {});
      clearInterval(flick);
      $("#coinF").textContent = v;
      coin.querySelector(".front small").textContent = coinLabel(v, a, b) || "RESULT";
      blip(1400, 0.08, "triangle", 0.05);
    } else {
      const die = $("#die");
      die.querySelector(".f1").textContent = v;
      const sx = 360 * (3 + randInt(3)), sy = 360 * (3 + randInt(3));
      const anim = die.animate([
        { transform: "translateY(-30px) rotateX(23deg) rotateY(-31deg)" },
        { transform: `translateY(-110px) rotateX(${sx / 2 + 45}deg) rotateY(${sy / 2 + 60}deg)`, offset: 0.45 },
        { transform: `translateY(0) rotateX(${sx - 20}deg) rotateY(${sy + 15}deg)`, offset: 0.85 },
        { transform: `translateY(0) rotateX(${sx}deg) rotateY(${sy}deg)` },
      ], { duration: reduceMotion ? 10 : 1700, easing: "cubic-bezier(.25,.7,.3,1)", fill: "forwards" });
      await anim.finished.catch(() => {});
      blip(220, 0.1, "square", 0.05);
    }
    const note = $("#rngNote").value.trim();
    const label = rngMode === "coin" ? coinLabel(v, a, b) : "";
    $("#rngResult").innerHTML = `${note ? esc(note) : "The number is"}<b class="num">${label ? label + " · " : ""}${v}</b>`;
    (N().rolls = N().rolls || []).push({ ts: Date.now(), min: a, max: b, mode: rngMode, result: v, note });
    save(); renderRolls(); fanfare();
    rolling = false; $("#rngGo").disabled = false;
  });

  // ---------- Boot ----------
  function renderAll() {
    const n = N();
    const pending = n.pending ? 1 : 0;
    $("#tab-spin").innerHTML = `Spin${pending ? '<span class="badge">1</span>' : ""}`;
    if (S.tab === "setup") renderSetup();
    if (S.tab === "spin") renderSpin();
    if (S.tab === "scores") renderScores();
    if (S.tab === "history") renderHistory();
  }
  applySkin();
  setTab(S.tab || "setup");
  checkIncoming();
  window.addEventListener("hashchange", checkIncoming);
})();
</script>

  // Offline support + installable app. Runs only on the hosted site.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
