html[data-skin="policenauts"] body::after {

}
/* HUD corner brackets on every panel */
html[data-skin="policenauts"] .panel {
  background:
    linear-gradient(var(--hud), var(--hud)) left top / 18px 2px no-repeat, linear-gradient(var(--hud), var(--hud)) left top / 2px 18px no-repeat,
    linear-gradient(var(--hud), var(--hud)) right top / 18px 2px no-repeat, linear-gradient(var(--hud), var(--hud)) right top / 2px 18px no-repeat,
    linear-gradient(var(--accent), var(--accent)) left bottom / 18px 2px no-repeat, linear-gradient(var(--accent), var(--accent)) left bottom / 2px 18px no-repeat,
    linear-gradient(var(--accent), var(--accent)) right bottom / 18px 2px no-repeat, linear-gradient(var(--accent), var(--accent)) right bottom / 2px 18px no-repeat,
    var(--panel);
}

html[data-skin="policenauts"] h2, html[data-skin="policenauts"] .up-next .who, html[data-skin="policenauts"] .brand-name, html[data-skin="policenauts"] .landed .game-title {
  color: #f4fdff; text-shadow: -2px 0 rgba(255, 43, 214, .85), 2px 0 rgba(57, 243, 255, .85), 0 0 14px rgba(255, 43, 214, .45);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background-color: var(--bg);
  background-image: var(--bg-art);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
  transition: background-color .4s, color .4s;
}
html[data-skin="metalgear"] body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3, .display {
  font-family: var(--font-display);
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  font-weight: var(--display-weight);
  text-wrap: balance;
  margin: 0;
  line-height: 1.1;
}
html[data-skin="nintendo"] h2 { font-size: 15px; line-height: 1.5; }
html[data-skin="nintendo"] h3 { font-size: 11px; line-height: 1.6; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-right: auto; }
.brand svg { width: 52px; height: 52px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); }
html[data-skin="nintendo"] .brand-name { font-size: 15px; }
html[data-skin="metalgear"] .brand-name { font-size: 2.1rem; }
.brand-sub { font-size: .8rem; color: var(--muted); }
.skins { display: flex; flex-wrap: wrap; gap: 6px; }
.skin-btn {
  font: 700 .72rem/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  padding: 8px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}
/* 19 themes is too many for a button row, so the picker is a dropdown */
.skins { display: none; }
.skin-select { display: flex; align-items: center; gap: 8px; }
.skin-select select { width: auto; padding: 7px 10px; font-weight: 700; }
.skin-btn i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.skin-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; }
.tab {
  font: 700 .95rem/1 var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track);
  background: none; border: 0; color: var(--muted); padding: 10px 14px; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0;
  border-bottom: 3px solid transparent;
}
html[data-skin="nintendo"] .tab { font-size: 10px; }
html[data-skin="metalgear"] .tab { font-size: 1.3rem; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .badge { font-family: var(--font-body); font-size: .7rem; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: 2px; letter-spacing: 0; }
.tabs .spacer { flex: 1; }

/* Generic pieces */
main { padding-block: 24px; }
.view { display: grid; gap: 20px; }
.panel { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 12px; }
.btn {
  font: 700 .95rem/1 var(--font-body); cursor: pointer; border-radius: calc(var(--radius) * .7);
  padding: 11px 16px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  transition: transform .12s, background .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.big { font-size: 1.15rem; padding: 16px 26px; min-height: 58px; font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); }
html[data-skin="nintendo"] .btn.big { font-size: 12px; }
html[data-skin="metalgear"] .btn.big { font-size: 1.6rem; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); background: transparent; }
.btn.small { padding: 7px 10px; min-height: 34px; font-size: .82rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
html[data-skin="nintendo"] .btn { border: 3px solid #1f1a1a; box-shadow: 3px 3px 0 #1f1a1a; }
html[data-skin="nintendo"] .btn:active { box-shadow: 0 0 0 #1f1a1a; transform: translate(3px,3px); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="number"], select, textarea {
  font: 500 1rem/1.3 var(--font-body); color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 9px 11px; width: 100%; min-width: 0;
}
html[data-skin="nintendo"] input[type="text"], html[data-skin="nintendo"] input[type="number"], html[data-skin="nintendo"] select, html[data-skin="nintendo"] textarea { border: 2px solid #1f1a1a; }
label.field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; background: var(--panel-2); }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.note { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: .9rem; color: var(--muted); }

/* Setup */
.setup-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 16px; }
.pcard { display: grid; gap: 10px; align-content: start; }
.pcard-head { display: flex; gap: 8px; align-items: center; }
.pcard-head .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.pcard-head input { font-weight: 700; font-size: 1.05rem; }
.games-list { display: grid; gap: 6px; counter-reset: g; margin: 0; padding: 0; list-style: none; }
.games-list li { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 6px; }
.games-list li::before { counter-increment: g; content: counter(g); font-size: .78rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.games-list li.played input { text-decoration: line-through; opacity: .55; }
.games-list input { padding: 7px 9px; font-size: .95rem; }
.pcard.active { outline: 3px solid var(--accent); outline-offset: 2px; }
.avatar-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 3px solid var(--pc); background: var(--panel-2); font-size: 1.3rem; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.art-av { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -0.25em; }
.art-av svg, .emoji-grid button svg { width: 100%; height: 100%; display: block; }
.emoji-grid button svg { width: 1.5em; height: 1.5em; margin: auto; }
.avatar-btn .art-av { width: 30px; height: 30px; vertical-align: middle; }
.scard .pname .art-av { width: 1.4em; height: 1.4em; }
.avatar-pick { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.emoji-grid button { font-size: 1.2rem; border: 1px solid transparent; background: none; border-radius: 8px; padding: 4px; cursor: pointer; color: var(--fg); }
.emoji-grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--panel); }
.color-row { display: flex; flex-wrap: wrap; gap: 6px; }
.color-row button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
.color-row button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--fg); }
.lib-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 220px; overflow-y: auto; }
.lib-chip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.lib-chip button { font: 600 .88rem/1.2 var(--font-body); background: none; border: 0; color: var(--fg); cursor: pointer; padding: 7px 4px 7px 12px; }
.lib-chip button.x { color: var(--muted); padding: 7px 10px 7px 6px; }
.lib-chip .ct { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.lib-chip.used { opacity: .45; }
.tag { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); vertical-align: 1px; font-family: var(--font-body); font-weight: 700; }
.inject { border-top: 1px solid var(--line); padding-top: 12px; }
.inject .row input { flex: 1 1 200px; }
.lib-chip button[data-logpick] { padding-right: 12px; }
.lib-chip.picked { background: var(--accent); border-color: var(--accent); }
.lib-chip.picked button { color: var(--accent-fg); }
.win-name { color: var(--accent); font-weight: 700; }

/* Spin */
.spin-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .spin-layout { grid-template-columns: 1fr; } }
.wheel-box { position: relative; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 1; }
.wheel-box canvas { width: 100%; height: 100%; display: block; }
.pointer {
  position: absolute; left: 50%; top: -6px; width: 34px; height: 44px; transform: translateX(-50%); z-index: 2;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); transform-origin: 50% 10%;
}
.pointer svg { width: 100%; height: 100%; }
.pointer.tick { animation: tick .12s ease-out; }
@keyframes tick { 0% { transform: translateX(-50%) rotate(0); } 40% { transform: translateX(-50%) rotate(-14deg); } 100% { transform: translateX(-50%) rotate(0); } }
.wheel-box.big { aspect-ratio: 5 / 6; max-width: 620px; cursor: pointer; }
.wheel-box.big .hub { display: none; }
.wheel-box.big .pointer { left: -14px; top: 50%; width: 40px; height: 50px; transform: translateY(-50%) rotate(-90deg); transform-origin: 50% 50%; }
.wheel-box.big .pointer.tick { animation: tickSide .12s ease-out; }
@keyframes tickSide { 0% { transform: translateY(-50%) rotate(-90deg); } 40% { transform: translateY(-50%) rotate(-76deg); } 100% { transform: translateY(-50%) rotate(-90deg); } }
.wheel-box.big canvas { border-radius: calc(var(--radius) * .6); }
html.tv .wheel-box.big { max-width: min(68vh, 760px); }
.hub {
  position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%,-50%);
  border-radius: 50%; border: 4px solid var(--accent); background: var(--panel-2); color: var(--fg); cursor: pointer;
  font: 400 clamp(.8rem, 2.6vw, 1.2rem)/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em;
  box-shadow: 0 0 0 6px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.5);
}
html[data-skin="nintendo"] .hub { font-size: 10px; }
.hub:disabled { cursor: wait; }
.up-next { display: grid; gap: 6px; }
.up-next .who { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); color: var(--accent); overflow-wrap: anywhere; }
html[data-skin="nintendo"] .up-next .who { font-size: clamp(16px, 4vw, 24px); line-height: 1.3; }
.order { display: flex; flex-wrap: wrap; gap: 6px; }
.order .chip.now { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { font: 600 .82rem/1 var(--font-body); border: 0; background: transparent; color: var(--muted); padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.landed { display: grid; gap: 14px; border: 2px solid var(--accent); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.92); opacity: .4; } to { transform: none; opacity: 1; } }
.landed .game-title { font-family: var(--font-display); font-size: clamp(1.6rem, 4.5vw, 2.4rem); line-height: 1.05; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); overflow-wrap: anywhere; }
html[data-skin="nintendo"] .landed .game-title { font-size: 16px; line-height: 1.5; }
.alert-mark { display: none; }
html[data-skin="metalgear"] .alert-mark { display: inline-block; color: var(--danger); font-family: "VT323", monospace; font-size: 3rem; line-height: .7; text-shadow: 0 0 12px var(--danger); animation: blink .5s steps(2) 3; }
@keyframes blink { 50% { opacity: 0; } }
.winner-grid, .drink-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { cursor: pointer; user-select: none; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick > span { display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; }
.pick input:checked + span { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pick input[type="checkbox"] + span::before { content: "○"; font-weight: 700; }
.pick input[type="checkbox"]:checked + span::before { content: "✓"; }
.pick input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.amounts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.amounts .amt { min-width: 52px; font-variant-numeric: tabular-nums; }
.amounts .amt[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper input { width: 72px; text-align: center; }
.drinker { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); }
.drinker.off { opacity: .45; }
.drinker label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 700; }
.drinker .mini-amt { font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: center; font-weight: 700; }
.drinker button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-weight: 700; }

/* Round log */
.log { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.log li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.log .rn { font-family: var(--font-display); color: var(--muted); font-size: 1.1rem; }
html[data-skin="nintendo"] .log .rn { font-size: 10px; }
.log .what { min-width: 0; overflow-wrap: anywhere; }
.log .shots { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); text-align: right; }

/* Scores */
.score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.scard { display: grid; gap: 10px; justify-items: center; text-align: center; position: relative; }
.scard .crown { position: absolute; top: 12px; right: 12px; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; background: var(--accent); color: var(--accent-fg); padding: 4px 8px; border-radius: 999px; font-weight: 700; }
.scard .crown.alt { left: 12px; right: auto; background: var(--accent-2); color: #fff; }
.scard .pname { font-family: var(--font-display); font-size: 1.5rem; text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); overflow-wrap: anywhere; }
html[data-skin="nintendo"] .scard .pname { font-size: 13px; line-height: 1.5; }
.scard .total { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
html[data-skin="nintendo"] .scard .total { font-size: 22px; }
.glass-big { width: 120px; height: 156px; }
.minis { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; min-height: 30px; }
.minis svg { width: 22px; height: 29px; }
.minis .more { font-size: .8rem; color: var(--muted); align-self: center; }
.stat-row { display: flex; gap: 16px; justify-content: center; font-size: .9rem; color: var(--muted); }
.stat-row b { color: var(--fg); font-variant-numeric: tabular-nums; }
.penalty { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

/* Glass SVG */
.glass .wave { animation: wave 2.4s linear infinite; }
.glass.static .wave { animation: none; }
.glass .liq { transition: transform 1.1s cubic-bezier(.3,.8,.3,1); }
@keyframes wave { to { transform: translateX(-50px); } }
.glass .bub { animation: bub 2.8s ease-in infinite; opacity: 0; }
.glass .bub:nth-child(3) { animation-delay: .9s; }
.glass .bub:nth-child(4) { animation-delay: 1.7s; }
@keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(-70px); opacity: 0; } }

/* History */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td.n, th.n { text-align: right; }
details.night { border-top: 1px solid var(--line); padding-block: 10px; }
details.night summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; list-style: none; }
details.night summary::-webkit-details-marker { display: none; }
details.night summary::before { content: "▸"; color: var(--accent); transition: transform .2s; }
details.night[open] summary::before { transform: rotate(90deg); }
details.night .body { padding: 10px 0 0 18px; display: grid; gap: 10px; }
.hist-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .hist-grid { grid-template-columns: 1fr; } }

/* Overlay: pour + chaos roll */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(6px);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
/* floating player for a theme's Spotify or YouTube link */
.mini-player {
  position: fixed; z-index: 40; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  width: min(340px, calc(100vw - 24px)); background: var(--panel); border-radius: 12px; box-shadow: var(--shadow), 0 12px 30px rgba(0,0,0,.45); overflow: hidden;
}
.mp-head { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; font-weight: 700; font-size: .85rem; }
.mp-head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; font-weight: 700; }
.mp-frame iframe { display: block; width: 100%; border: 0; }
.mini-player[data-kind="spotify"] .mp-frame iframe { height: 152px; }
.mini-player[data-kind="youtube"] .mp-frame iframe { aspect-ratio: 16 / 9; height: auto; }
/* shrunk: keep the player running but out of the way */
.mini-player.small .mp-frame { height: 0; overflow: hidden; }
.tm-form { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
.tm-form select { width: auto; }
.tm-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tm-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: .9rem; }
.tm-list li > span { min-width: 0; }
.tm-url { font-size: .78rem; overflow-wrap: anywhere; }
@media (max-width: 640px) { .tm-form { grid-template-columns: 1fr; } .tm-form select { width: 100%; } }
#pour { z-index: 70; } /* the pour always plays on top, even over the bracket or recap */
.pour-card { display: grid; justify-items: center; gap: 10px; text-align: center; max-width: 440px; cursor: pointer; }
.pour-card .glass { width: 200px; height: 260px; }
.pour-card .count { font-family: var(--font-display); font-size: 4rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
html[data-skin="nintendo"] .pour-card .count { font-size: 34px; }
.pour-card .who { font-size: 1.15rem; }
.pour-card .quip { font-style: italic; color: var(--muted); }
.sheet-modal { width: min(760px, 100%); }
.recap { display: grid; gap: 10px; }
.recap-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 10px; align-items: baseline; padding-block: 8px; border-top: 1px solid var(--line); }
.recap-row:first-child { border-top: 0; }
.recap-row .ic { font-size: 1.4rem; }
.recap-row b { font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); }
.titles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.titles div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel-2); }
.trophy-grid { display: grid; gap: 12px; }
.trophy-player { display: grid; gap: 6px; }
.trophies { display: flex; flex-wrap: wrap; gap: 6px; }
.trophy { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: .85rem; background: var(--panel-2); }
.trophy .ti { font-size: 1.1rem; }
/* Stats */
.stats-head { display: grid; gap: 4px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px; align-items: start; }
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.viz-grid { stroke: var(--line); stroke-width: 1; }
.viz-axis { fill: var(--muted); font: 600 13px var(--font-body); }
.viz-label { fill: var(--fg); font: 700 14px var(--font-body); }
.viz-cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.viz-tip { position: absolute; z-index: 3; pointer-events: none; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .85rem; box-shadow: 0 8px 20px rgba(0,0,0,.35); min-width: 120px; }
.viz-tip .tip-h { color: var(--muted); font-size: .75rem; margin-bottom: 4px; }
.viz-tip i, .viz-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--fg); }
.bars { position: relative; display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 34%) minmax(0, 1fr) 3.2em; gap: 10px; align-items: center; border-radius: 6px; }
.bar-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.bar-track { height: 12px; background: color-mix(in srgb, var(--line) 50%, transparent); border-radius: 4px; }
.bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-val { text-align: right; font-weight: 700; color: var(--fg); }
.stats-players { display: flex; flex-wrap: wrap; gap: 6px; }
.stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); }
.tile .tv { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.tile .tl { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stats-two > .stack { align-content: start; }
.stats-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.rival, .game-rate { font-size: .95rem; }
/* Round photos */
.photo-thumb { display: inline-block; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); cursor: pointer; margin-top: 4px; }
.photo-thumb img { display: block; width: 64px; height: 64px; object-fit: cover; }
.photo-thumb.missing { display: none; }
.photo-strip { display: flex; flex-wrap: wrap; gap: 8px; }
.photo-strip .photo-thumb { display: grid; width: 110px; text-align: left; color: var(--fg); }
.photo-strip .photo-thumb img { width: 110px; height: 110px; }
.photo-strip .photo-thumb span { font-size: .75rem; padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.photo-view { display: grid; gap: 12px; max-width: min(900px, 100%); }
.photo-view img { max-width: 100%; max-height: 75vh; border-radius: 12px; object-fit: contain; }
/* Theme builder: live preview strip, color swatch grid. The whole page wears the draft while it's open. */
.tb-preview { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); background-image: var(--bg-art); }
.tb-wheel { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 0 0 3px var(--panel-2), 0 0 0 5px var(--accent); }
.tb-title { font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); font-size: 1.3rem; line-height: 1.1; overflow-wrap: anywhere; }
.tb-preview .glass { width: 54px; height: auto; }
.tb-warn { font-size: .88rem; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--danger); color: var(--fg); }
.tb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.tb-colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.tb-color { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: .88rem; cursor: pointer; }
.tb-color input { width: 34px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: none; cursor: pointer; flex: none; }
.tb-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tb-dots { display: inline-flex; }
.tb-dots i { width: 12px; height: 12px; border-radius: 50%; margin-right: -3px; box-shadow: 0 0 0 2px var(--panel-2); }
@media (max-width: 520px) { .tb-preview { grid-template-columns: auto 1fr; } .tb-preview .glass { display: none; } .tb-wheel { width: 64px; height: 64px; } }
/* Controller highlight, and the controller button map in Settings */
.pad-focus { outline: 3px solid var(--accent) !important; outline-offset: 3px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 30%, transparent); }
.pick input.pad-focus + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.pad-help { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: .9rem; }
.pad-map { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
.pad-map dt { font-weight: 700; color: var(--accent); }
.pad-map dd { margin: 0; }
/* Confetti sits above every overlay and never takes taps. The trophy card pops in with the theme's accent glow. */
#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 90; }
#celebrate { z-index: 75; }
.celeb-card { text-align: center; display: grid; gap: 6px; justify-items: center; max-width: 380px; padding: 28px 24px; box-shadow: 0 0 0 2px var(--accent), 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow); }
.celeb-icon { font-size: 4.2rem; line-height: 1; filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--accent) 60%, transparent)); }
.celeb-name { font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: var(--display-weight); font-size: 1.6rem; line-height: 1.1; }
.celeb-who { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
#celebrate.go .celeb-card { animation: celebPop .55s cubic-bezier(.2, 1.6, .4, 1) both; }
#celebrate.go .celeb-icon { animation: celebSpin .9s cubic-bezier(.2, 1.4, .4, 1) both .1s; }
@keyframes celebPop { from { transform: scale(.4) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes celebSpin { from { transform: scale(0) rotate(-200deg); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { #celebrate.go .celeb-card, #celebrate.go .celeb-icon { animation: none; } }
/* House rules card on the Spin tab: rule, cost, "Broke it"; edit mode swaps in inputs */
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rules li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.rules.editing li { grid-template-columns: 1fr auto auto; }
.rules.editing input { min-width: 0; width: 100%; }
.rule-text { overflow-wrap: anywhere; }
.rule-amt { font-weight: 700; color: var(--accent); }
.rule-who { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
@media (max-width: 520px) { .rules.editing li { grid-template-columns: 1fr auto; } .rules.editing li input { grid-column: 1 / -1; } .rules.editing li .seg { justify-self: start; } }
/* Tonight's scoreboard on the Stats tab */
.by-game { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.by-game li { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.bg-recs { display: flex; flex-wrap: wrap; gap: 6px; }
.bg-rec { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: .9rem; }
.bg-rec.up { border-color: var(--accent); }
.bg-rec.up b { color: var(--accent); }
.tonight-hl { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 16px; font-size: .95rem; }
/* Games tab header: title + "Adding to" on top, then labeled sections with aligned rows */
.cat-head { display: grid; gap: 16px; }
.cat-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: start; }
.cat-who { display: grid; gap: 4px; justify-items: end; text-align: right; min-width: 200px; }
.cat-who select { width: 100%; min-width: 200px; }
.cat-who .muted { font-size: .85rem; }
.cat-section { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.cat-families { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 16px; align-items: start; }
.cat-families .fam { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-top: 9px; }
.cat-families .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip-select { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; }
.chip-select select, html[data-skin] .chip-select select { width: auto; border: 0; box-shadow: none; background: transparent; padding: 6px 8px; font-weight: 700; }
.cat-add { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
.cat-custom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
@media (max-width: 640px) {
  .cat-top { grid-template-columns: 1fr; }
  .cat-who { justify-items: stretch; text-align: left; min-width: 0; }
  .cat-families { grid-template-columns: 1fr; gap: 4px; }
  .cat-families .fam { padding-top: 8px; }
  .cat-add { grid-template-columns: 1fr; }
}
.cat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; }
.cat-game { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); min-width: 0; }
.cat-game .t { min-width: 0; overflow-wrap: anywhere; }
.cat-game .t small { display: block; color: var(--muted); font-size: .78rem; }
.cat-game.added { opacity: .55; }
.cat-game .t span[title] { font-size: .9em; }
.cat-game { content-visibility: auto; contain-intrinsic-size: auto 58px; } /* keeps "Show all" fast on long lists */
.cat-game .btn { white-space: nowrap; flex: none; }
.tag-btns { display: inline-flex; gap: 2px; flex: none; margin-left: auto; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; font-size: 1rem; filter: grayscale(1); opacity: .35; padding: 0; }
.icon-btn[aria-pressed="true"] { filter: none; opacity: 1; border-color: var(--line); background: var(--panel); }
.icon-btn:hover { opacity: .8; }
.trophy { font: inherit; color: var(--fg); cursor: pointer; }
.trophy.locked { opacity: .35; filter: grayscale(1); }
.trophy-legend summary { cursor: pointer; }
.legend-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; margin-top: 8px; }
.legend-item { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: .9rem; }
.legend-item .ti { font-size: 1.3rem; line-height: 1.2; }
.bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.bround { display: grid; gap: 10px; align-content: center; }
.match { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel-2); display: grid; gap: 8px; }
.match .vs { font-weight: 700; }
.match .row input { flex: 1 1 120px; }
.champion { text-align: center; font-family: var(--font-display); font-size: 1.8rem; color: var(--accent); }
/* TV mode: one big screen with the wheel and the shot board, for casting or mirroring */
.tv-board { display: grid; gap: 8px; }
.tv-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding-block: 6px; border-top: 1px solid var(--line); }
.tv-row:first-child { border-top: 0; }
.tv-row svg { width: 40px; height: 52px; }
.tv-row .nm { font-family: var(--font-display); font-size: 1.3rem; overflow-wrap: anywhere; }
.tv-row .num { font-size: 1.3rem; font-weight: 700; }
html.tv body { font-size: 19px; }
html.tv .skin-select, html.tv .tabs .tab, html.tv #callGame { display: none; }
html.tv .wrap, html.tv .top-inner { max-width: none; }
html.tv .spin-layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
html.tv .wheel-box { max-width: min(78vh, 900px); }
html.tv #roundLog { display: none; }
html.tv footer { display: none; }
@media (max-width: 860px) { .tv-toggle { display: none; } }
.pour-card .pour-note { font-weight: 700; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.wild-card .game-title { color: var(--accent); }
details.bets summary { cursor: pointer; }
.bet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px; margin-block: 8px; }
.bet select { padding: 7px 9px; }
.wild-list { display: grid; gap: 8px; }
.wild-opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); cursor: pointer; font-size: .92rem; }
.wild-opt input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
.modal { width: min(640px, 100%); display: grid; gap: 16px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rng-stage { display: grid; place-items: center; min-height: 320px; position: relative; perspective: 900px; }
.rng-stage .wheel-box { max-width: 320px; }
.rng-result { text-align: center; font-family: var(--font-display); font-size: 1.1rem; min-height: 1.5em; }
.rng-result b { font-size: 2.4rem; color: var(--accent); display: block; line-height: 1.1; }
html[data-skin="nintendo"] .rng-result b { font-size: 24px; }
.rng-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; align-items: end; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.coin { width: 170px; height: 170px; position: relative; transform-style: preserve-3d; }
.coin .face {
  position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; backface-visibility: hidden;
  font: 400 3.4rem/1 var(--font-display); color: var(--accent-fg);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 60%, #fff), var(--accent) 55%, color-mix(in srgb, var(--accent) 60%, #000));
  box-shadow: inset 0 0 0 8px color-mix(in srgb, var(--accent) 70%, #000), inset 0 0 0 12px color-mix(in srgb, var(--accent) 80%, #fff);
}
.coin .face small { display: block; font-size: .8rem; letter-spacing: .2em; font-family: var(--font-body); font-weight: 700; margin-top: 4px; }
.coin .face > div { text-align: center; }
html[data-skin="nintendo"] .coin .face { font-size: 26px; }
.coin .back { transform: rotateX(180deg); }
.die { width: 130px; height: 130px; position: relative; transform-style: preserve-3d; }
.die .f {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 18%;
  font: 400 3rem/1 var(--font-display); background: var(--panel-2); color: var(--fg);
  border: 3px solid var(--accent); box-shadow: inset 0 0 24px rgba(0,0,0,.35);
}
html[data-skin="nintendo"] .die .f { font-size: 22px; }
.die .f1 { transform: translateZ(65px); }
.die .f2 { transform: rotateY(180deg) translateZ(65px); }
.die .f3 { transform: rotateY(90deg) translateZ(65px); }
.die .f4 { transform: rotateY(-90deg) translateZ(65px); }
.die .f5 { transform: rotateX(90deg) translateZ(65px); }
.die .f6 { transform: rotateX(-90deg) translateZ(65px); }
.ticker { font: 400 6rem/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.rolls { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .9rem; }
.rolls li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 4px; }
.rolls li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--accent); color: var(--accent-fg); padding: 10px 16px; border-radius: 999px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  max-width: calc(100% - 32px);
}
.empty { text-align: center; padding: 30px 10px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
footer { text-align: center; font-size: .8rem; color: var(--muted); padding-top: 20px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <!-- Logo: a shot glass whose liquid is a prize wheel, mid-pour -->
        <defs>
          <clipPath id="logoClip"><path d="M14 14 L50 14 L45 52 L19 52 Z"/></clipPath>
        </defs>
        <g clip-path="url(#logoClip)">
          <rect x="0" y="24" width="64" height="40" fill="var(--liquid)"/>
          <g transform="translate(32 37)"><circle r="13.5" fill="var(--liquid-2)"/><path d="M0 0 L0.00 -12.00 A12 12 0 0 1 8.49 -8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L8.49 -8.49 A12 12 0 0 1 12.00 0.00 Z" fill="var(--fg)"/><path d="M0 0 L12.00 0.00 A12 12 0 0 1 8.49 8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L8.49 8.49 A12 12 0 0 1 0.00 12.00 Z" fill="var(--fg)"/><path d="M0 0 L0.00 12.00 A12 12 0 0 1 -8.49 8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L-8.49 8.49 A12 12 0 0 1 -12.00 0.00 Z" fill="var(--fg)"/><path d="M0 0 L-12.00 0.00 A12 12 0 0 1 -8.49 -8.49 Z" fill="var(--liquid-2)"/><path d="M0 0 L-8.49 -8.49 A12 12 0 0 1 -0.00 -12.00 Z" fill="var(--fg)"/><circle r="2.6" fill="var(--accent)"/></g>
        </g>
        <path d="M11 10 L53 10 L47 54 L17 54 Z" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round"/>
        <rect x="16" y="54" width="32" height="5" rx="1.5" fill="var(--fg)"/>
        <path d="M32 4 L28 10 L36 10 Z" fill="var(--accent)"/>
        <circle cx="54" cy="22" r="2.4" fill="var(--liquid)"/>
        <path d="M52 16 q2 3 2 5" stroke="var(--liquid)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand-name">Pour Decisions</div>
        <div class="brand-sub" id="tagline">Bet list night</div>
      </div>
    </div>
    <div class="skins" id="skins" role="group" aria-label="Theme"></div>
    <label class="skin-select"><span class="eyebrow">Theme</span><select id="skinSelect" aria-label="Theme"></select></label>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="setup" id="tab-setup">Lineup</button>
      <button class="tab" role="tab" data-tab="spin" id="tab-spin">Spin</button>
      <button class="tab" role="tab" data-tab="scores" id="tab-scores">Shots</button>
      <button class="tab" role="tab" data-tab="stats" id="tab-stats">Stats</button>
      <button class="tab" role="tab" data-tab="games" id="tab-games">Games</button>
      <button class="tab" role="tab" data-tab="history" id="tab-history">History</button>
      <span class="spacer"></span>
      <button class="btn small ghost" id="musicBtn" type="button" aria-pressed="false">♪ Music off</button>
      <button class="btn small ghost tv-toggle" id="tvBtn" type="button">TV mode</button>
      <button class="btn small" id="callGame" type="button">Log a game</button>
      <button class="btn small primary" id="openRng" type="button">Chaos roll</button>
    </nav>
  </div>
</header>

<main class="wrap">

  let removeArm = null, activeId = null, libQuery = "";
  const activePid = () => (playerById(activeId) ? activeId : N().players[0]?.id);
  function libraryPanelHTML() {
    const hidden = new Set(S.libHidden || []);
    const lib = gameLibrary().filter((g) => !hidden.has(g.key));
    const who = playerById(activePid());
    const mine = new Set((who?.games || []).map((g) => g.title.trim().toLowerCase()));
    if (!lib.length) return `<div class="panel note">Every game you play gets saved to your library. Next time you build a lineup, you can tap games from it instead of typing them in.</div>`;
    return `<div class="panel stack" id="libPanel">
      <div class="row" style="justify-content:space-between">
        <div class="stack" style="gap:2px"><h3>Games you've played</h3><div class="muted" style="font-size:.9rem">Tap a game to add it to <b>${esc(who?.name || "?")}</b>'s list. Tap a player's card to switch who you're filling.</div></div>
        <input type="text" id="libSearch" value="${esc(libQuery)}" placeholder="Search ${lib.length} games" aria-label="Search played games" style="max-width:240px">
      </div>
      <div class="lib-chips">${lib.map((g) => `<span class="lib-chip ${mine.has(g.key) ? "used" : ""}" data-key="${esc(g.key)}" ${libQuery && !g.key.includes(libQuery.toLowerCase()) ? "hidden" : ""}><button type="button" data-libadd="${esc(g.title)}">${esc(g.title)}<span class="ct">×${g.plays}</span></button><button type="button" class="x" data-libhide="${esc(g.key)}" aria-label="Remove ${esc(g.title)} from the library">✕</button></span>`).join("")}</div>

  $("#view-setup").addEventListener("focusin", (e) => {
    const card = e.target.closest("[data-pid]");
    if (!card || card.dataset.pid === activePid()) return;
    activeId = card.dataset.pid;
    $$("#view-setup .pcard").forEach((c) => c.classList.toggle("active", c.dataset.pid === activeId));
    const lp = $("#libPanel b"); if (lp) lp.textContent = playerById(activeId).name || "?";
    const mine = new Set(playerById(activeId).games.map((g) => g.title.trim().toLowerCase()));
    $$("#view-setup .lib-chip").forEach((c) => c.classList.toggle("used", mine.has(c.dataset.key)));
  });
  $("#view-setup").addEventListener("input", (e) => {
    const el = e.target, n = N();
    const card = el.closest("[data-pid]");
    if (el.id === "libSearch") {
      libQuery = el.value.trim();
      $$("#view-setup .lib-chip").forEach((c) => (c.hidden = !!libQuery && !c.dataset.key.includes(libQuery.toLowerCase())));
      return;
    }

    if (!card) return;
    const p = playerById(card.dataset.pid);
    if (el.dataset.field === "name") p.name = el.value;
    if (el.dataset.gid) { const g = p.games.find((x) => x.id === el.dataset.gid); if (g) { g.title = el.value; delete g.console; } }

  $("#view-setup").addEventListener("change", (e) => {
    if (e.target.id === "perPlayer") {

      N().perPlayer = per;
      N().players.forEach((p) => {
        while (p.games.length < per) p.games.push({ id: uid(), title: "" });
        // only trim empty slots so picks are never lost
        while (p.games.length > per && !p.games[p.games.length - 1].title.trim()) p.games.pop();

    } else if (e.target.closest("[data-pid]")) {
      renderSetupCounts();
    }

  function renderSetupCounts() {
    // light refresh without stealing focus: update the "x/10 picked" labels
    $$("#view-setup [data-pid]").forEach((card) => {
      const p = playerById(card.dataset.pid); if (!p) return;
      const i = N().players.indexOf(p);

  $("#view-setup").addEventListener("click", (e) => {
    const n = N();
    const card = e.target.closest(".pcard");
    if (card && card.dataset.pid !== activePid() && !e.target.closest("button, input")) {
      activeId = card.dataset.pid; renderSetup(); return;
    }
    const av = e.target.closest("[data-avatar]");
    if (av) { avatarOpen = avatarOpen === av.dataset.avatar ? null : av.dataset.avatar; renderSetup(); return; }
    const em = e.target.closest("[data-emoji]"), pc = e.target.closest("[data-pcolor]"), art = e.target.closest("[data-art]");
    if ((em || pc || art) && card) {
      const p = playerById(card.dataset.pid);
      if (em) { p.emoji = em.dataset.emoji || undefined; p.art = undefined; }
      if (art) { p.art = art.dataset.art; p.emoji = AVATAR_ART[p.art].emoji; }
      if (pc) p.color = pc.dataset.pcolor;
      n.sample = false; save(); renderSetup(); return;
    }
    if (e.target.closest("[data-libadd]")) {
      const title = e.target.closest("[data-libadd]").dataset.libadd;
      const p = playerById(activePid()); if (!p) return;
      // the same game can go on a list more than once, so it can come up twice in a night
      const slot = p.games.find((g) => !g.title.trim());
      if (!slot) return toast(`${p.name}'s list is full`);
      const again = p.games.some((g) => g.title.trim().toLowerCase() === title.toLowerCase());
      slot.title = title; n.sample = false; save(); renderSetup();
      if (again) toast(`${title} is on ${p.name}'s list twice now`);
      return;
    }
    if (e.target.closest("[data-libhide]")) {
      S.libHidden = [...new Set([...(S.libHidden || []), e.target.closest("[data-libhide]").dataset.libhide])];
      save(); renderSetup(); toast("Removed from the library");
      return;
    }
    if (e.target.closest("#addPlayer")) {
      n.players.push(mkPlayer("Player " + (n.players.length + 1), [], n.perPlayer));
      n.sample = false; save(); renderSetup();
      const last = n.players[n.players.length - 1];
      $("#pname-" + last.id)?.select();
    } else if (e.target.closest("#shuffleOrder")) {
      const cur = spinner();
      for (let i = n.players.length - 1; i > 0; i--) { const j = randInt(i + 1); [n.players[i], n.players[j]] = [n.players[j], n.players[i]]; }
      n.turn = cur ? Math.max(0, n.players.indexOf(cur)) : 0;
      save(); renderSetup(); toast("Turn order shuffled");
    } else if (e.target.closest("#clearSample")) {
      n.players = [mkPlayer("Player 1", [], n.perPlayer), mkPlayer("Player 2", [], n.perPlayer)];
      n.sample = false; n.rounds = []; n.turn = 0; save(); renderSetup();
    } else if (e.target.closest("[data-remove]")) {
      const id = e.target.closest("[data-remove]").dataset.remove;
      if (removeArm !== id) { removeArm = id; renderSetup(); setTimeout(() => { if (removeArm === id) { removeArm = null; renderSetup(); } }, 3000); return; }
      removeArm = null;
      const cur = spinner();
      n.players = n.players.filter((p) => p.id !== id);
      n.turn = cur && cur.id !== id ? n.players.indexOf(cur) : (n.players.length ? n.turn % n.players.length : 0);
      if (n.pending && n.pending.by === id) n.pending = null;
      save(); renderSetup();
    } else if (e.target.closest("#startNight")) {
      const ready = n.players.filter((p) => p.name.trim() && p.games.some((g) => g.title.trim()));
      if (n.players.length < 2) return toast("Add at least two players");
      if (ready.length < n.players.length) return toast("Every player needs a name and at least one game");
      if (!n.started) n.started = Date.now();
      save(); setTab("spin");
    }
  });

  // line chart: one line per player across nights (up to 8 players, the most regular ones)
  function shotsChartHTML(st, roster, colorOf) {
    const series = roster.slice(0, 8), n = st.nights.length;
    if (statsTable.shots) {
      return `<div class="table-wrap"><table><thead><tr><th>Night</th>${series.map((p) => `<th class="n">${esc(plText(p))}</th>`).join("")}</tr></thead><tbody>
        ${st.nights.map((nt, i) => `<tr><td>${fmtDate(nt.started || nt.created)}</td>${series.map((p) => `<td class="n">${p.perNight[i] !== undefined ? fmtShots(p.perNight[i]) : "–"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    const W = 520, H = 250, L = 40, Rm = series.length <= 4 ? 92 : 16, T = 14, B = 32;
    const max = Math.max(1, ...series.flatMap((p) => Object.values(p.perNight)));
    const top = Math.ceil(max / 2) * 2 || 2;
    const x = (i) => (n === 1 ? L + (W - L - Rm) / 2 : L + (i * (W - L - Rm)) / (n - 1));
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const ticks = [0, top / 2, top];
    const ptsOf = (p) => Object.keys(p.perNight).map(Number).sort((a, b) => a - b).map((i) => [x(i), y(p.perNight[i])]);
    // end-of-line labels, nudged apart (at least 16 units) so close values don't overlap
    const ends = series.length <= 4 ? series.map((p) => { const q = ptsOf(p); return q.length ? { p, x: q[q.length - 1][0], y: q[q.length - 1][1] } : null; }).filter(Boolean).sort((a, b) => a.y - b.y) : [];
    ends.forEach((e, i) => { if (i && e.y - ends[i - 1].y < 16) e.y = ends[i - 1].y + 16; });
    const lines = series.map((p) => {
      const pts = ptsOf(p), c = colorOf(p.key);
      return `<g><polyline points="${pts.map((q) => q.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((q) => `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${c}" stroke="var(--panel-2)" stroke-width="2"/>`).join("")}</g>`;
    }).join("") + ends.map((e) => `<text x="${e.x + 9}" y="${e.y + 5}" class="viz-label">${esc(e.p.name)}</text>`).join("");
    const xl = st.nights.map((nt, i) => (n <= 8 || i % Math.ceil(n / 8) === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" class="viz-axis">${new Date(nt.started || nt.created).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text>` : "")).join("");
    return `<div class="chart-wrap" data-chart="shots">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Shots per night for each player">
        ${ticks.map((v) => `<line x1="${L}" x2="${W - Rm}" y1="${y(v)}" y2="${y(v)}" class="viz-grid"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" class="viz-axis">${fmtShots(v)}</text>`).join("")}
        ${xl}${lines}
        <line class="viz-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
        <rect class="viz-hit" x="${L - 10}" y="0" width="${W - L - Rm + 20}" height="${H}" fill="transparent"/>
      </svg>
      <div class="viz-tip" hidden></div>
    </div>
    ${series.length >= 2 ? `<div class="viz-legend">${series.map((p) => `<span><i style="background:${colorOf(p.key)}"></i>${esc(plText(p))}</span>`).join("")}</div>` : ""}
    ${roster.length > 8 ? `<div class="muted" style="font-size:.85rem">Showing the 8 most regular players. The table has the same 8.</div>` : ""}`;
  }
  // horizontal bars, one series (so one color, no legend); values in text color at the bar end
  function barsHTML(id, rows, fmt, maxV) {
    if (statsTable[id]) return `<div class="table-wrap"><table><tbody>${rows.map((r) => `<tr><td>${r.html}</td><td class="n">${fmt(r.value)}</td><td class="n muted">${esc(r.note)}</td></tr>`).join("")}</tbody></table></div>`;
    const max = maxV || Math.max(1, ...rows.map((r) => r.value));
    return `<div class="bars" data-chart="${id}">${rows.map((r) => `<div class="bar-row" tabindex="0" data-tip="${esc(r.label)}: ${esc(fmt(r.value))} · ${esc(r.note)}">
      <span class="bar-label">${r.html}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.max(r.value ? 2 : 0, (r.value / max) * 100)}%"></span></span>
      <span class="bar-val num">${esc(fmt(r.value))}</span></div>`).join("")}<div class="viz-tip" hidden></div></div>`;
  }
  function wireCharts(box, st, roster, colorOf) {
    // line chart crosshair: nearest night, every player's value at that night
    const wrap = box.querySelector('[data-chart="shots"]');
    if (wrap) {
      const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".viz-tip"), cross = svg.querySelector(".viz-cross"), hit = svg.querySelector(".viz-hit");
      const n = st.nights.length, series = roster.slice(0, 8);
      const W = 520, L = 40, Rm = series.length <= 4 ? 92 : 16;
      const move = (ev) => {
        const r = svg.getBoundingClientRect(), vx = ((ev.clientX - r.left) / r.width) * W;
        const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round(((vx - L) / (W - L - Rm)) * (n - 1))));
        const cx = n === 1 ? L + (W - L - Rm) / 2 : L + (i * (W - L - Rm)) / (n - 1);
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
        tip.replaceChildren();
        const h = document.createElement("div"); h.className = "tip-h"; h.textContent = fmtDate(st.nights[i].started || st.nights[i].created); tip.append(h);
        series.forEach((p) => {
          if (p.perNight[i] === undefined) return;
          const row = document.createElement("div"), sw = document.createElement("i"), v = document.createElement("b"), l = document.createElement("span");
          sw.style.background = colorOf(p.key); v.textContent = fmtShots(p.perNight[i]); l.textContent = " " + p.name;
          row.append(sw, v, l); tip.append(row);
        });
        tip.hidden = false;
        const px = (cx / W) * r.width;
        tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, px + 12)) + "px"; tip.style.top = "8px";
      };
      hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
      hit.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
    }
    // bar tooltips on hover and keyboard focus
    box.querySelectorAll(".bars").forEach((bars) => {
      const tip = bars.querySelector(".viz-tip");
      const show = (row) => { tip.textContent = row.dataset.tip; tip.hidden = false; tip.style.left = "8px"; tip.style.top = row.offsetTop - tip.offsetHeight - 4 + "px"; };
      bars.querySelectorAll(".bar-row").forEach((row) => {
        row.addEventListener("pointerenter", () => show(row)); row.addEventListener("focus", () => show(row));
        row.addEventListener("pointerleave", () => (tip.hidden = true)); row.addEventListener("blur", () => (tip.hidden = true));
      });
    });
  }

  // ---------- History ----------
  let deleteArm = null, endArm = false;
  function allTime() {
    const map = {};
    const nights = [...S.archive, ...(N().started ? [N()] : [])];
    nights.forEach((night) => {
      const t = totals(night);
      night.players.forEach((p) => {
        const key = p.name.trim().toLowerCase(); if (!key) return;
        const m = map[key] || (map[key] = { name: p.name.trim(), nights: 0, wins: 0, shots: 0, games: 0 });
        m.nights++; m.wins += t[p.id].wins; m.shots += t[p.id].shots;
        m.games += night.rounds.filter((r) => r.gameId && (r.drinks.some((d) => d.pid === p.id) || r.winner === p.id)).length;
      });
    });
    return Object.values(map).sort((a, b) => b.wins - a.wins || a.shots - b.shots);
  }
  function nightSummary(night) {
    const t = totals(night);

    const champ = night.players.slice().sort((a, b) => t[b.id].wins - t[a.id].wins)[0];
    return { played, shots, champ: champ && t[champ.id].wins ? champ.name : "—", t };
  }

      setTimeout(() => reject(new Error("Spotify API timed out")), 8000);
      if (document.getElementById("spotifyApi")) return;
      window.onSpotifyIframeApiReady = (api) => { spotifyApi = api; spotifyWaiters.splice(0).forEach((f) => f(api)); };
      const sc = document.createElement("script");
      sc.id = "spotifyApi"; sc.src = "https://open.spotify.com/embed/iframe-api/v1"; sc.async = true;
      sc.onerror = () => { sc.remove(); reject(new Error("Spotify API failed to load")); };
      document.head.appendChild(sc);
    });
  }
  function loopSpotify(ctl, uri) {
    let nearEnd = false, restarting = false;
    ctl.addListener("playback_update", (e) => {
      const d = (e && e.data) || {}; if (!d.duration || restarting) return;
      const atEnd = d.position >= d.duration - 1500;
      if (!d.isPaused) nearEnd = atEnd; // playlists move to the next song on their own, which clears this
      else if (nearEnd) {
        // it stopped right at the end: the song, album, or playlist finished
        restarting = true; nearEnd = false;
        ctl.loadUri(uri);
        setTimeout(() => { try { ctl.play(); } catch { /* player gone */ } restarting = false; }, 700);
      }
    });
  }
  function stopSpotify() { if (spotifyCtl) { try { spotifyCtl.destroy(); } catch { /* already gone */ } spotifyCtl = null; } }
  // YouTube's player accepts volume commands; Spotify's embed doesn't, so it just keeps playing
  function embedVolume(pct) {
    const f = $("#mpFrame iframe"); if (!f || $("#miniPlayer").dataset.kind !== "youtube") return;
    try { f.contentWindow.postMessage(JSON.stringify({ event: "command", func: "setVolume", args: [pct] }), "*"); } catch { /* player not ready */ }
  }
  function applyMusic() {
    if (!S.music) { Music.stop(); hideEmbed(); return; }
    const link = musicLinkFor(S.skin);
    if (link) { Music.stop(); showEmbed(link); embedVolume(S.musicVol ?? 40); }
    else { hideEmbed(); Music.start(); }
  }
  $("#mpToggle").addEventListener("click", () => { const box = $("#miniPlayer"); box.classList.toggle("small"); $("#mpToggle").textContent = box.classList.contains("small") ? "+" : "–"; });
  $("#mpClose").addEventListener("click", () => { S.music = false; save(); applyMusic(); syncMusicBtn(); if (S.tab === "history") renderHistory(); });

  function syncMusicBtn() { const b = $("#musicBtn"); b.setAttribute("aria-pressed", String(!!S.music)); b.textContent = S.music ? "♪ Music on" : "♪ Music off"; }
  function toggleMusic() { S.music = !S.music; save(); applyMusic(); syncMusicBtn(); }
  $("#musicBtn").addEventListener("click", toggleMusic);
  $("#view-history").addEventListener("input", (e) => { if (e.target.id === "musicVol") { S.musicVol = +e.target.value; save(); Music.setVolume(); embedVolume(S.musicVol); } });
  document.addEventListener("pointerdown", function first() { if (S.music && !Music.playing && !embedNow) applyMusic(); document.removeEventListener("pointerdown", first); });
  // the built-in loop pauses in the background; Spotify/YouTube players handle that themselves
  document.addEventListener("visibilitychange", () => { if (document.hidden) Music.stop(); else if (S.music && !musicLinkFor(S.skin) && !Music.playing && document.hasFocus()) Music.start(); });
  syncMusicBtn();
  applySkin();
  setTab(S.tab || "setup");
  checkIncoming();
  window.addEventListener("hashchange", checkIncoming);
})();
</script>
